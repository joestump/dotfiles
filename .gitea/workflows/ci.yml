name: ci
on: [push, pull_request]

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + zsh + jq + chezmoi + shellcheck
        # chezmoi lets the render-based suites (chezmoiexternal.bats,
        # vault-agent-stale.bats) actually run here instead of skipping; jq backs
        # the approle-setup identity-merge path exercised by
        # vault-approle-blast-radius.bats; python3 backs the crush-providers
        # JSON validation in the bats job; shellcheck lets lint-shell.bats
        # exercise the real gate rather than skipping past it.
        run: |
          sudo apt-get update && sudo apt-get install -y bats zsh jq python3 make shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: BATS suite
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh jq yamllint python3 make
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ShellCheck — plain scripts + rendered chezmoi templates
        # Deliberately `make lint`, not an inline copy of the globs. The old
        # inline version drifted from the Makefile — the Makefile's glob missed
        # every `.chezmoiscripts/*.sh.tmpl`, so a contributor's green `make
        # lint` said nothing about the scripts that run on every apply, while
        # only CI knew. scripts/lint-shell.sh is now the single definition of
        # what "shell lint" means, and both callers run it. It also renders
        # each template across its `.chezmoi.os` and `-agent` gate variants,
        # which this ubuntu runner could not otherwise reach: before, the
        # darwin-only branches were never linted anywhere in CI.
        #
        # `lint-shell` rather than `lint` because secret scanning has its own
        # workflow (gitleaks.yaml) with the shared action; this runner has no
        # gitleaks binary and does not need one.
        run: make lint-shell

      - name: zsh -n — shell config
        run: |
          for f in $(git ls-files 'dot_oh-my-zsh/custom/*.zsh' 'dot_config/dotfiles/*.zsh') dot_zshrc; do
            echo "zsh -n $f"; zsh -n "$f"
          done

      - name: Validate JSON
        run: for f in $(git ls-files '*.json'); do echo "$f"; jq empty "$f"; done

      - name: Validate TOML
        run: |
          # chezmoi treats `.chezmoi<name>.toml` (e.g. .chezmoiexternal.toml,
          # .chezmoidata.toml) as templates by rule — they can contain {{ }} and
          # aren't valid raw TOML. Render every TOML through chezmoi first (non-
          # template files pass through unchanged) and then validate.
          for f in $(git ls-files '*.toml'); do
            echo "$f"
            chezmoi execute-template --source "$PWD" < "$f" \
              | python3 -c 'import tomllib,sys; tomllib.load(sys.stdin.buffer)'
          done

      - name: yamllint — workflows
        run: |
          yamllint -d "{extends: relaxed, rules: {truthy: disable, line-length: disable, document-start: disable}}" .gitea/workflows

      - name: Docs — no legacy admonition syntax
        # The site sets `future: {v4: true}`, which turns off
        # markdown.mdx1Compat.admonitions. Under that flag the MDX v1 form
        # `:::warning Title` is NOT parsed — it renders as literal ":::warning
        # Title" text in the page, silently, with no build warning. Only the
        # untitled `:::warning` and the directive-label `:::warning[Title]`
        # forms work. Every titled admonition on the site was broken this way
        # before it was noticed, so this is a check rather than a convention.
        run: |
          if grep -rnE '^:::(note|tip|info|warning|danger|caution) +[^[]' website/docs; then
            echo "::error::Legacy MDX v1 admonition syntax found — use :::type[Title] instead."
            exit 1
          fi
          echo "OK — no legacy admonition syntax"
