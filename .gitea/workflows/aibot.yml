# AI bot for this repo: automatic code review on every PR push (Crush + Z.ai GLM),
# plus the on-demand author-self-reference modes (review / address / merge).
# entrypoint.sh re-checks the trigger authoritatively; the `if:` below is just a
# cheap pre-filter so the container doesn't spin up for every comment.
name: aibot

on:
  # pull_request_target, NOT pull_request: PRs from joestump-agent/dotfiles are a
  # FORK in Gitea's eyes, and Gitea (like GitHub) withholds repo secrets from
  # pull_request-triggered workflows on forks — the AIBOT_ZAI_* secrets always
  # rendered empty on agent PRs. It silently never surfaced before because every
  # prior fork-PR run happened to hit a `synchronize` event, which entrypoint.sh
  # skips before it ever reads a secret; the first `opened` event on a fork PR
  # (#113) exposed it as a hard failure on the required check.
  # pull_request_target runs with the BASE repo's secrets/token regardless of
  # where the head branch lives, so the checkout step below (which already
  # explicitly fetches the PR's head repo+ref for fork PRs) now gets a bot that
  # can actually authenticate. The trade-off: this also means the checked-out
  # code runs WITH those secrets, so the trusted-author check in the `if:` below
  # is load-bearing, not decorative — it's what keeps a stranger's drive-by fork
  # PR from harvesting AIBOT_GITEA_TOKEN / AIBOT_ZAI_API_TOKEN via a malicious
  # crush.json/.mcp.json MCP server definition. Do not widen that allowlist
  # without re-thinking this comment.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]   # automatic code review
  issue_comment:
    types: [created]            # PR conversation comments → review / merge
  pull_request_review_comment:
    types: [created]            # author's inline review comments → address
  pull_request_review:
    types: [submitted]          # formal Approve → merge

permissions:
  contents: write               # push commits in `address` mode; merge in `merge` mode
  pull-requests: write          # post reviews / comments
  issues: write                 # comment on issues

jobs:
  aibot:
    runs-on: ubuntu-latest
    # Cheap gate: auto-review on non-draft PR events, else only when the actor is
    # the PR's own author. (entrypoint.sh loop-guards the bot's own pushes.) The
    # trusted-author check is required because this job now runs with secrets
    # against whatever the PR's head branch contains (see the `on:` comment).
    if: >
      contains(fromJSON('["joestump", "joestump-agent"]'),
        github.event_name == 'issue_comment' && github.event.issue.user.login || github.event.pull_request.user.login)
      && (
        (github.event_name == 'pull_request_target'
          && github.event.pull_request.draft == false)
        ||
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && github.event.comment.user.login == github.event.issue.user.login)
        ||
        (github.event_name == 'pull_request_review_comment'
          && github.event.sender.login == github.event.pull_request.user.login)
        ||
        (github.event_name == 'pull_request_review'
          && github.event.sender.login == github.event.pull_request.user.login)
      )
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # The head branch may live on a FORK (e.g. joestump-agent/dotfiles).
          # Without `repository:` the checkout resolves head.ref against THIS
          # repo's origin, where a fork branch does not exist — the job then dies
          # with "A branch or tag with the name '<ref>' could not be found" before
          # the bot ever runs, failing the required check on every fork PR.
          # Falls back to this repo for same-repo PRs and non-PR events.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # PR branch so `address` mode can commit + push back to it.
          ref: ${{ github.event.pull_request.head.ref || github.head_ref }}
          fetch-depth: 0

      - name: AI bot
        # Full URL is required on Gitea: a bare `owner/repo` resolves against
        # github.com (404), not your local instance. (Or set the instance's
        # [actions] DEFAULT_ACTIONS_URL = self to allow the bare form.)
        uses: https://gitea.stump.rocks/stumpcloud/gitea-aibot-action@main
        env:
          # --- harness selection ----------------------------------------------
          AIBOT_HARNESS: ${{ vars.AIBOT_HARNESS || 'crush' }}          # claude | opencode | crush
          AIBOT_MODEL:   ${{ vars.AIBOT_MODEL   || 'zaicoding/glm-4.7' }}

          # --- Crush harness: Z.ai (GLM coding plan, OpenAI-compatible) --------
          AIBOT_ZAI_BASE_URL:  ${{ secrets.AIBOT_ZAI_BASE_URL }}       # e.g. https://api.z.ai/api/coding/paas/v4
          AIBOT_ZAI_API_TOKEN: ${{ secrets.AIBOT_ZAI_API_TOKEN }}

          # --- claude/opencode harness (optional): LiteLLM gateway ------------
          AIBOT_LITELLM_BASE_URL: ${{ secrets.AIBOT_LITELLM_BASE_URL }}
          AIBOT_LITELLM_API_KEY:  ${{ secrets.AIBOT_LITELLM_API_KEY }}

          # --- Gitea (auto token is enough for same-repo comment + push) ------
          AIBOT_GITEA_HOST:  ${{ github.server_url }}
          AIBOT_GITEA_TOKEN: ${{ github.token }}
          AIBOT_BOT_LOGIN:   ${{ vars.AIBOT_BOT_LOGIN }}               # loop guard (the token's user)

      # Want the bot to reach Outline or any other MCP server? Don't configure it
      # here — declare it in THIS repo's own .mcp.json (Claude Code) / opencode.json
      # (OpenCode) / crush.json (Crush). The bot loads and trusts the repo's MCP
      # servers automatically; only gitea-mcp is bundled. See the action README.
