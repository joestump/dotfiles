# Non-secret template data, shared across every machine. Reference these in any
# `.tmpl` file as {{ .signalNumber }} etc. This file is committed and NOT encrypted
# — it's for config, not secrets (secrets come from OpenBao at runtime).
#
# Single source of truth for values that were previously hardcoded in many places.
# To change one, edit here and `chezmoi apply`.

# ---------- Identity ----------
# ONE repo serves multiple identities — the human on their own machines, the
# agent on agent boxes — with separate, unique forge handles, emails, and
# Signal numbers. NO identity value (username, email, phone number) lives in
# this repo. Everything resolves from exactly two sources:
#
#   1. `whoami` + the $USER / $USER-agent convention — the OS login user IS
#      the forge handle (.chezmoi.username at apply time, $(whoami) in runtime
#      scripts), and every install pairs a human user with a `<human>-agent`
#      bot user. That makes BOTH handles and the acting ROLE derivable from
#      whoami alone: a login with the `-agent` suffix is the bot; stripping
#      the suffix names its human. whoami also keys the per-user OpenBao bag,
#      which makes the env below whoami-scoped by construction.
#   2. OpenBao env injection — Vault Agent renders secret/users/<whoami>/* into
#      ~/.config/vault/secrets-static.env; login shells source it
#      (00-secrets.zsh), czu sources it before apply, and the harness daemon
#      loads the systemd flavor. Identity values ride in as env vars:
#        SIGNAL_MCP_ACCOUNT   the number this box sends AS. NOTE: the
#                             signal-cli DAEMON runs in multi-account mode (no
#                             `-a`) — see test/signal-wiring.bats — so this
#                             scopes only the signal-mcp client, not the daemon.
#        SIGNAL_MCP_OPERATOR  the human the agent serves (signal-notify target,
#                             scheduled-task summaries, signal-mcp --operator).
#        SIGNAL_MCP_TRUSTED_RECIPIENTS / SIGNAL_MCP_TRUSTED_SENDERS
#                             allowlists, read by signal-mcp at runtime.
#        FORGE_USER           escape hatch for a box whose OS login differs
#                             from its forge handle (credential helper).
#
# Rendered configs therefore carry NO identity: signal-mcp reads SIGNAL_MCP_*
# from its runtime env wherever a shell/daemon env exists (the sole exception
# is Claude Desktop — a GUI app with no shell env — where run_after_44 bakes
# the env values at apply time, still env-only, no committed fallback).

# Explicit override of the acting identity for a box whose OS login user does
# not follow the $USER / $USER-agent convention. Empty = derive from `whoami`
# (.chezmoi.username). Set it in that box's ~/.config/chezmoi/chezmoi.toml
# [data] table, same as the [data.claude] posture keys below. The `-agent`
# suffix (or its absence) picks which .chezmoitemplates/agents/identity-*.md
# role overlay (agent | human) is composed into ~/.claude/CLAUDE.md,
# ~/.config/crush/CRUSH.md and ~/.config/agents/AGENTS.md.
agentIdentity: ""

# THE ONE SET OF IDENTITY VALUES THAT CANNOT BE DERIVED — the git commit emails,
# consumed by dot_gitconfig.tmpl. Everything else about the identity still comes
# from whoami (the name, and which branch below applies); only these addresses
# are stated, because there is no rule that maps a login to them.
#
# Getting one wrong is not cosmetic. A forge attributes a commit by matching the
# author email against that ACCOUNT's registered addresses, so an invented
# address (say <login>@stump.wtf) leaves every commit with no avatar, no profile
# link and no contribution credit — permanently, since history is immutable.
#
# The human has a DIFFERENT registered address per forge, so the git identity is
# selected by remote URL at runtime (includeIf hasconfig:remote.*.url), not by
# machine. `gitea` is the default — it is the primary forge, and it is what a
# repo with no remote yet gets. The agent has one address everywhere, so an
# agent box takes `agent` unconditionally and no per-forge include is rendered.
#
# Forking this setup? Replace these with your own registered addresses, same as
# githubUser below.
gitEmail:
  agent: "agent@stump.wtf"
  gitea: "joe@stump.rocks"
  github: "joe@joestump.net"

# UPSTREAM REPO OWNER — the account whose repos the externals, claude-plugins
# sources, and czinit clone from. This is NOT the acting identity (both
# identities pull Joe's repos); for "who am I", use whoami + the env, above.
# Fork this whole setup? Set this to your own handle and everything re-points.
githubUser: "joestump"

# Shlink (URL shortener) base URL — non-secret config for the shlink OMZ plugin,
# exported as SHLINK_API_URL from env.zsh. The API KEY is the secret half and comes
# from OpenBao (secret/users/<you>/shlink → SHLINK_API_KEY), NOT here.
shlinkApiUrl: "https://u.stu.mp"

# LiteLLM gateway (OpenAI-compatible) base URL. Single source of truth for the
# OPENAI_BASE_URL export in env.zsh and the crush `litellm` provider base_url. The
# API KEY is the secret half and comes from OpenBao (secret/users/<you>/llm →
# LITELLM_API_KEY), NOT here.
litellmUrl: "https://litellm.stump.rocks/v1"

# NOTE: cairn needs no entry here — both halves of its MCP definition come from
# OpenBao ($CAIRN_BASE_URL + CAIRN_API_TOKEN in secrets-static.env), exactly as
# Crush already reaches it. See run_after_43/44-claude-*-mcp-merge.

# msgbrowse's local MCP endpoint. The desktop shell binds a FIXED port (8789)
# precisely so this URL survives a relaunch — it used to take an ephemeral port
# and the MCP URL changed every time (msgbrowse 56123e1). Loopback-only, so
# there is no token: the port is the whole address.
msgbrowseMcpEndpoint: "http://127.0.0.1:8789/mcp"

giteaUrl: "https://gitea.stump.rocks"

# Outline (wiki) base URL. Non-secret; the crush `outline` MCP appends `/mcp`. The
# token half comes from OpenBao (secret/users/<you>/… → OUTLINE_API_TOKEN), NOT here.
outlineUrl: "https://outline.stump.rocks"

# crush fork — Joe's agent-account fork of Charm's Crush, built from source by
# run_after_install-crush (the fork keeps the upstream module path + ships no
# release binaries, so it can't be `go install`-ed). Lives on joestump-agent (NOT
# {{ .githubUser }}) because that account maintains it. Single source of truth for
# both the .chezmoiexternal.toml clone URL and the build script's remote guard.
crushRepo: "https://github.com/joestump-agent/crush.git"

# crush-switchboard worker pool — how many identical Crush instances drain the
# Switchboard queue on this machine.
#
# They are COMPETING CONSUMERS, not a fan-out: every worker attaches to the SAME
# vended endpoint with the SAME credential, so switchboard hands each caller a
# different todo (the claim scan holds FOR UPDATE SKIP LOCKED) and exactly one
# worker acts on each. That is the shape to want for capacity. Routing one
# webhook to several ENDPOINTS is the other thing entirely — every endpoint gets
# its own todo and they all act, which duplicates work rather than sharing it.
#
# Because the pool is homogeneous, every worker shares one CRUSH_GLOBAL_DATA and
# therefore one model pin; only the harness name differs. Nothing here needs to
# scale per worker.
#
# 1 restores the previous single-worker behaviour. Keep it modest: each worker is
# a full model session, and zai is quota-metered, so the ceiling is the weekly
# quota rather than the box.
#
# @joestump-agent 09/05/2026 - Added so more than one Crush can drain the queue.
crushSwitchboardWorkers: 2

# harness ("systemctl for your agents") — built from source by
# run_after_32-install-harness, same model as crushRepo above: the repo ships no
# release binaries, so there is nothing to download. Public repo on the stump.wtf
# Gitea org, so the external needs no credential guard. Single source of truth for
# both the .chezmoiexternal.toml clone URL and the build script's remote guard.
harnessRepo: "https://gitea.stump.rocks/stump.wtf/harness.git"

# harness, the PUBLIC face. harnessRepo above is the CLONE url and points at the
# canonical Gitea copy — correct for git, wrong for anything a human reads,
# because gitea.stump.rocks is private and a link to it is a dead link for
# everyone outside this household. Every public-facing mention of harness (the
# attribution footers the scheduled sweeps post on GitHub PRs and issues, docs,
# READMEs) links THIS url instead — the downstream GitHub mirror. Never publish
# the Gitea one. See .chezmoitemplates/agents/base.md, "Never link Gitea in
# anything public".
harnessPublicUrl: "https://github.com/stump-wtf/harness"

# OpenBao / Vault server address. Single source of truth for the agent config
# (agent.hcl), the systemd units + launchd plists that run it, and the czu updater.
# Referenced as {{ .vaultAddr }} in those *.tmpl files; the Consul-Template *.ctmpl
# files read it from the agent's env ({{ env "VAULT_ADDR" }}) since chezmoi does not
# template them.
vaultAddr: "https://vault.stump.rocks"

# Whether the Vault Agent renders the shared SSH private key onto this machine
# (dotfiles#12 blast-radius control). Default on — trusted machines get the key as
# always. Opt an untrusted/throwaway box OUT in its ~/.config/chezmoi/chezmoi.toml
# ([data] vaultSshKeys = false), which takes precedence over this file.
vaultSshKeys: true

# SSH client config. Rendered into ~/.ssh/config by private_dot_ssh/private_config.tmpl
# — the file used to be a static block of hand-maintained Host stanzas, so adding a
# node meant copy-pasting five lines and getting one of them wrong. Everything here
# is data; the template does the shaping.
#
# ORDER MATTERS. ssh_config is first-match-wins PER KEYWORD, so the most specific
# blocks must render before the general ones. The template emits, in this order:
#
#   1. ssh.hosts          specific blocks, in list order
#   2. ssh.jump.hosts     bastion'd hosts, expanded from one shared option set
#   3. ssh.multiplex      the catch-all ControlMaster rule
#   4. ssh.defaults       the `Host *` fallbacks (keepalives), last
#
# Because of first-match-wins, an entry added to ssh.hosts always beats the jump and
# multiplex rules below it — that is the supported way to special-case one node
# without breaking the shared groups apart.
#
# Every block is {patterns: [...], options: {...}}. `patterns` becomes the `Host a b c`
# line; `options` becomes the indented keyword lines, emitted in sorted keyword order
# (deterministic, and ssh does not care about intra-block order). An option value may
# be a LIST to emit that keyword more than once — e.g. two IdentityFile lines.
#
# Values are quoted strings throughout, deliberately: unquoted `yes`/`no` are booleans
# to some YAML parsers and would render as `true`/`false`, which ssh rejects.
#
# Per-machine overrides go in that box's ~/.config/chezmoi/chezmoi.toml under
# [data.ssh], same as [data.claude] below. Maps DEEP-MERGE and lists REPLACE, so
# `[data.ssh.jump.options] ProxyJump = "root@other.bastion"` repoints the bastion on
# one box while keeping the shared IdentityFile/IdentitiesOnly/StrictHostKeyChecking,
# but overriding ssh.jump.hosts swaps the whole list rather than appending to it.
ssh:
  hosts:
    # GitHub over 443 — port 22 is blocked on plenty of hotel/corp networks.
    - patterns: ["github.com"]
      options:
        Hostname: "ssh.github.com"
        Port: "443"
        User: "git"
        IPQoS: "throughput"
        # github.com routes to ssh.github.com:443, whose host key lives under the
        # [ssh.github.com]:443 identity. On a fresh box with an empty known_hosts,
        # strict checking makes the first clone fail ("No ED25519 host key is
        # known"); accept-new pins on first contact and rejects later changes.
        StrictHostKeyChecking: "accept-new"

    # tars runs the joestump-agent identity, so its account is `joestump-agent`
    # rather than the local username ssh defaults to. Without this block,
    # `ssh tars.stump.rocks` from a joestump machine fails with
    # "Permission denied (publickey,password)" even though the key IS authorized
    # for the right account — a failure that reads exactly like a missing key.
    #
    # @joestump-agent 08/29/2026 - Added after that misdiagnosis cost a session:
    # tars was written off as unreachable, so the sweeps running there went
    # unexamined while their cost was being investigated.
    - patterns: ["tars", "tars.stump.rocks"]
      options:
        HostName: "tars.stump.rocks"
        User: "joestump-agent"

    # cloud01 bootstrap — temporary, remove after WG/internal DNS lands
    # (cloud01.stump.rocks is NXDOMAIN on the LAN, hence the literal IP).
    # The bare `cloud01` alias is listed so `ssh cloud01` keeps working.
    - patterns: ["cloud01", "cloud01.stump.rocks", "179.237.64.122"]
      options:
        HostName: "179.237.64.122"
        User: "joestump"
        IPQoS: "none"

  # Hosts reachable only via a ProxyJump through the hypervisor. Each address below
  # becomes its own Host block carrying `options` verbatim, so adding a node is one
  # line here instead of a six-line copy-paste.
  jump:
    options:
      User: "joestump"
      ProxyJump: "root@dagda.stump.rocks"
      IdentityFile: "~/.ssh/id_ansible"
      IdentitiesOnly: "yes"
      StrictHostKeyChecking: "accept-new"
    hosts:
      - "192.168.100.213"   # ie02 on dagda (DUB)
      - "192.168.100.210"
      - "192.168.100.220"

  # Connection multiplexing for StumpCloud/infra hosts: reuse one TCP connection per
  # host so heavy-SSH sessions don't exhaust local ephemeral ports (EADDRNOTAVAIL /
  # "Can't assign requested address"). Deliberately excludes github.com — a shared
  # public endpoint.
  multiplex:
    patterns:
      - "*.stump.rocks"
      - "*.stump.wtf"
      - "192.168.100.*"
      - "179.237.64.122"
      - "lir"
      - "dagda"
    options:
      ControlMaster: "auto"
      ControlPath: "~/.ssh/cm-%C"
      ControlPersist: "10m"

  # Global fallbacks, emitted LAST as `Host *`. Because ssh_config is
  # first-match-wins PER KEYWORD, anything a block above already set still wins;
  # this only fills in keywords nobody claimed.
  #
  # Keepalives belong here and nowhere else. Without ServerAliveInterval ssh
  # sends nothing on an idle connection, so a NAT table or a Wi-Fi power-save
  # blip drops the flow and NEITHER end notices — the session looks alive until
  # the next keystroke, then dies as "Shared connection to <host> closed",
  # taking any long-running remote session with it. 60s/3 gives up after ~3
  # minutes of genuine silence, well inside the 5-15 minute idle timeout most
  # consumer NAT tables use.
  defaults:
    patterns:
      - "*"
    options:
      ServerAliveInterval: "60"
      ServerAliveCountMax: "3"
      TCPKeepAlive: "yes"

