# Claude Code permission posture, merged into ~/.claude/settings.json by
# .chezmoiscripts/run_onchange_after_48-claude-settings-merge.sh. These are the
# SHARED DEFAULTS = interactive/attended (Claude asks before acting) — the right
# posture for a personal laptop. An UNATTENDED box (e.g. an autonomous agent that
# runs scheduled tasks) overrides them per-machine in its chezmoi config's
# [data.claude] table (~/.config/chezmoi/chezmoi.toml), which takes precedence over
# this file — no fork of the shared repo required. Override just the keys you need.
claude:
  # Startup permission mode. One of: default | acceptEdits | plan | auto |
  # bypassPermissions | dontAsk. "auto" runs a safety classifier (allows safe
  # actions, soft-denies destructive ones unless intent is clear, hard-denies
  # security boundaries) — what an unattended box wants so runs don't stall on
  # prompts. "default" keeps a laptop attended.
  permissionMode: "default"
  # Skip the one-time "accept Auto mode" opt-in dialog. Only meaningful when a box
  # sets permissionMode "auto"; harmless otherwise.
  skipAutoPermissionPrompt: false
  # Skip the multi-agent workflow usage warning (the prompt Auto mode shows before
  # running a Workflow). Unattended boxes set this true so a workflow doesn't hang.
  skipWorkflowUsageWarning: false
  # Skip the "bypass permissions" acceptance dialog. Independent of permissionMode.
  skipDangerousModePermissionPrompt: false

# Ghostty host-based tab/window coloring via OSC 11. The zsh hook in
# dot_oh-my-zsh/custom/ghostty-host-colors.zsh.tmpl reads these mappings and
# emits an OSC 11 escape on every precmd + chpwd, tinting the active terminal
# surface (and the macOS tabs titlebar) to match the current hostname. Known
# hosts get explicit colors; unknown hosts hash into the fallback palette.
#
# Colors are Catppuccin Mocha surface/base tints — muted enough to keep text
# readable but distinct enough to tell tabs apart at a glance. Each entry is
# {host: <hostname or pattern>, color: "#rrggbb"}.
ghostty:
  hostColors:
    - host: "dagda"
      color: "#1e1e2e"   # base — the default/local machine
    - host: "tars"
      color: "#1a1b26"   # deep blue-grey
    - host: "cloud01"
      color: "#1e2030"   # mantle blue
    - host: "lir"
      color: "#24273a"   # surface0
    - host: "*.stump.rocks"
      color: "#181926"   # crust — catch-all for infra hosts
  # Palette used for hosts not listed above. The hook hashes the hostname into
  # this list so the same unknown host always gets the same color. All entries
  # are dark Catppuccin-compatible backgrounds that keep white/light text legible.
  fallbackPalette:
    - "#1e1e2e"   # base
    - "#1a1b26"   # deep blue-grey
    - "#1e2030"   # mantle blue
    - "#24273a"   # surface0
    - "#181926"   # crust
    - "#1c1e2d"   # custom dark navy
    - "#1f2028"   # custom charcoal-blue
    - "#21222e"   # custom slate

# Scheduled Sweep Ownership
#
# Which single machine arms each metered sweep, per identity. A sweep's drop-in
# renders its `[harness.*]` table ONLY on the host named for the identity that
# machine runs as, so the schedule fires once per identity across the fleet
# instead of once per machine. An empty string disarms that side entirely.
#
# This exists because a cron in a drop-in is evaluated in each host's LOCAL
# time. `30 15 * * *` on three machines in two timezones is three independent
# full runs a day at three different absolute times, not one.
#
# @joestump-agent 08/29/2026 - Added after pr-sweep billed ~$80 of Hyper in
# under an hour. It lost its `-agent` identity gate on 08/25 (deliberately, so
# the human identity would sweep too) and nothing replaced it, so every
# human-identity machine ran its own full pass. Per Joe: tars owns the
# joestump-agent sweeps, kitt owns the joestump ones, and the MacBook runs no
# scheduled sweeps at all — it is an interactive machine, and a sweep that
# fires there competes with the person using it.
#
# @joestump-agent 08/31/2026 - Extended to ALL FIVE sweeps. Only pr-sweep was
# host-gated; the other four gated on the `-agent` login suffix alone, which
# names an IDENTITY and not a MACHINE. That is only a single-runner rule while
# exactly one agent box exists — the second one silently doubles every
# ungated sweep, with two agents racing on the same repos, opening duplicate
# PRs and posting duplicate Signal alerts.
#
# Found while evaluating a second agent login on ai01. That move was dropped
# (tars keeps the sweeps — it is a dedicated box with 17 GB free against
# ai01's 9 GB, and ai01 runs the very vLLM engine four of these sweeps call,
# so a runaway sweep there would kill its own model server). The gap it
# exposed is real regardless of whether anything ever moves, and it is the
# same shape as the 08/29 incident above: a gate that reads as "one machine"
# but is not.
sweeps:
  # Hostnames as `.chezmoi.hostname` sees them (short name, e.g. "kitt").
  # Empty disarms that identity's sweep fleet-wide.
  #
  # pr-sweep is the only one with a HUMAN side — it renders for both identities
  # on staggered schedules (09:30 agent / 15:30 human). The other four render
  # for the agent identity only, so a HumanHost key for them would be a value
  # no template reads. Add one at the same time you add a human branch, not
  # before.
  #
  # FORGE/SITE SPLIT (2026-09-03): pr-sweep shares its host keys with
  # pr-sweep-github (staggered 10:00/16:00), and stumpcloudSweepAgentHost
  # arms THREE site-scoped drop-ins (stumpcloud-sweep-dub/-dtw/-pdx,
  # staggered 07:00/07:20/07:40). One key per scope family is deliberate:
  # the halves of a split sweep live and die together — an empty key or a
  # host mismatch disarms all of them, so a split can never leave one half
  # armed on a box where the other half silently vanished.
  prSweepAgentHost: "tars"
  prSweepHumanHost: "kitt"
  stumpcloudSweepAgentHost: "tars"
  issueSweepAgentHost: "tars"
  blogSweepAgentHost: "tars"
  navidromeLdapSyncAgentHost: "tars"
  morningBriefAgentHost: "tars"
