# Non-secret template data, shared across every machine. Reference these in any
# `.tmpl` file as {{ .signalNumber }} etc. This file is committed and NOT encrypted
# — it's for config, not secrets (secrets come from OpenBao at runtime).
#
# Single source of truth for values that were previously hardcoded in many places.
# To change one, edit here and `chezmoi apply`.

# Joe's personal Signal number (E.164) = the OPERATOR default: the human the
# agent serves. Backs the signal-notify recipient and scheduled-task summaries.
# Quoted so YAML keeps it a string.
#
# Both identities are overridable by env vars provisioned from OpenBao
# (secret/users/<you>/signal), with this number as the dev-box fallback:
#
#   SIGNAL_MCP_ACCOUNT   signal-mcp `--account` (the number the agent runs AS).
#                        OpenBao-provisioned nodes serve from the agent's own
#                        number (+353871760709). NOTE: the signal-cli DAEMON
#                        runs in multi-account mode (no `-a`) — see
#                        test/signal-wiring.bats — so SIGNAL_MCP_ACCOUNT
#                        scopes only the signal-mcp client, not the daemon.
#   SIGNAL_MCP_OPERATOR  signal-mcp `--operator` (the human the agent serves).
#                        Defaults to this number on a bare dev box without
#                        OpenBao (account == operator == Joe → Note to Self).
#   SIGNAL_MCP_TRUSTED_RECIPIENTS / SIGNAL_MCP_TRUSTED_SENDERS
#                        Inbound/outbound allowlists. Read by signal-mcp from
#                        the env at runtime; never rendered as CLI flags.
#
# Templates use `{{ env "SIGNAL_MCP_*" | default .signalNumber }}`, so omitting
# an env var falls back to this number rather than breaking the apply.
signalNumber: "+12062257886"

# Contact email. Not currently referenced anywhere (the repo had no real email — the
# joestump@host strings are SSH targets), but kept here as the single place to set it
# if a template ever needs {{ .email }}.
email: "joe@stump.rocks"

# Forge username — the Gitea AND GitHub handle (same on both). Used in repo/external
# URLs, the Gitea git-credential helper, czinit, and the claude-plugins sources. Fork
# this repo? Set this to your own handle and everything re-points. Distinct from
# {{ .chezmoi.username }} (the OS login user), which stays machine-derived.
githubUser: "joestump"

# Which forge identity the agents on this machine act as. Drives which
# .chezmoitemplates/agents/identity-*.md overlay is composed into ~/.claude/CLAUDE.md
# and ~/.config/crush/CRUSH.md — mainly whether posts carry the "on behalf of
# @joestump" attribution footer (joestump) or are signed as the agent itself
# (joestump-agent). Default suits Joe's own machines; a box that runs as the agent
# overrides it in its own ~/.config/chezmoi/chezmoi.toml [data] table, same as the
# [data.claude] posture keys below. Valid: joestump | joestump-agent.
agentIdentity: "joestump"

# Shlink (URL shortener) base URL — non-secret config for the shlink OMZ plugin,
# exported as SHLINK_API_URL from env.zsh. The API KEY is the secret half and comes
# from OpenBao (secret/users/<you>/shlink → SHLINK_API_KEY), NOT here.
shlinkApiUrl: "https://u.stu.mp"

# LiteLLM gateway (OpenAI-compatible) base URL. Single source of truth for the
# OPENAI_BASE_URL export in env.zsh and the crush `litellm` provider base_url. The
# API KEY is the secret half and comes from OpenBao (secret/users/<you>/llm →
# LITELLM_API_KEY), NOT here.
litellmUrl: "https://litellm.stump.rocks/v1"

# Switchboard's per-client path segment for Claude Code, minted by switchboard and
# appended to $SWITCHBOARD_BASE_URL by run_after_43-claude-code-mcp-merge to bake
# ~/.claude.json's .mcpServers.switchboard.url — Claude Code ONLY (deliberately not
# the Desktop merge). Only the path lives here: the HOST comes from OpenBao
# (SWITCHBOARD_BASE_URL) and so does the Bearer
# (secret/users/<you>/switchboard → SWITCHBOARD_CLAUDE_CODE_API_KEY), NOT here.
switchboardMcpPath: "/mcp/joestump-claude-code-f47b11a4"

# NOTE: cairn needs no entry here — both halves of its MCP definition come from
# OpenBao ($CAIRN_BASE_URL + CAIRN_API_TOKEN in secrets-static.env), exactly as
# Crush already reaches it. See run_after_43/44-claude-*-mcp-merge.

# msgbrowse's local MCP endpoint. The desktop shell binds a FIXED port (8789)
# precisely so this URL survives a relaunch — it used to take an ephemeral port
# and the MCP URL changed every time (msgbrowse 56123e1). Loopback-only, so
# there is no token: the port is the whole address.
msgbrowseMcpEndpoint: "http://127.0.0.1:8789/mcp"

